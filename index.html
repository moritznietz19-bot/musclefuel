<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MuscleFuel"><link rel="manifest" href="manifest.webmanifest"><title>MuscleFuel</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4fb;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:20px 16px 95px}h1{margin:0;font-size:27px}h2{font-size:21px}.green{color:#4ade80}small,p{color:#aebfd1}.card{background:#1a2940;border:1px solid #32455e;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#152237;padding:14px;border-radius:12px}.stat strong{display:block;font-size:24px;margin:6px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:13px 0;border-bottom:1px solid #32455e}.item:last-child{border:0}.item small{display:block;margin-top:5px}input[type=checkbox]{accent-color:#4ade80;width:22px;height:22px}input[type=number]{background:#101827;border:1px solid #536983;color:white;padding:10px;border-radius:8px;width:110px;font-size:16px}button{background:#2b405b;color:white;border:0;border-radius:10px;padding:12px;font:inherit}.primary{background:#4ade80;color:#101827;font-weight:bold}.wide{width:100%}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#152237;border-top:1px solid #32455e;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}nav button{background:transparent;padding:9px 5px;font-size:11px;flex:1;min-width:0}nav .active{color:#4ade80;background:#294351}details{padding:10px 0}summary{font-weight:bold;cursor:pointer}</style></head><body><main><header><h1>💪 Muscle<span class="green">Fuel</span></h1><small>Dein kostenloser Ernährungsbegleiter</small></header><section ];
const KEY="musclefuel-free";const today=()=>new Date().toLocaleDateString("sv-SE");let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s||!Array.isArray(s.plan))s={start:today(),plan:[],done:{},shop:{},weight:73,weights:[],kcal:2800,protein:150};let page="Heute";if(!Array.isArray(s.history))s.history=[];if(!s.costs)s.costs={};let period="7";if(!s.hidden||typeof s.hidden!=="object")s.hidden={};function visible(i,j){return !s.hidden[i+"-"+j]}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function mealDate(i){let d=new Date(s.start+"T12:00:00");d.setDate(d.getDate()+i);return d.toLocaleDateString("sv-SE")}function logMeal(k,checked){let [i,j]=k.split("-").map(Number),day=mealDate(i);s.history=s.history.filter(x=>x.key!==day+"-"+j);if(checked)s.history.push({key:day+"-"+j,date:day,id:s.plan[i][j],cost:Number(s.costs[k]||0)})}function money(v){return Number(v||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"})}function generate(v=0){s.start=today();s.plan=Array.from({length:7},(_,i)=>[(i+v)%2,2+Math.floor((i+v)/3)%2,4+(i+v)%2,6+(i+v)%2]);s.done={};s.shop={};s.hidden={};save()}if(!s.plan.length)generate();function di(){return Math.max(0,Math.min(6,Math.round((new Date(today()+"T12:00:00")-new Date(s.start+"T12:00:00"))/86400000)))}function date(i){let d=new Date(s.start+"T12:00:00");d.setDate(d.getDate()+i);return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}function render(){document.getElementById("nav").innerHTML=["Heute","Woche","Einkauf","Statistik","Gewicht","Ziele"].map(x=>'<button data-page="'+x+'" class="'+(page===x?"active":"")+'">'+({Heute:"🏠",Woche:"📅",Einkauf:"🛒",Statistik:"📊",Gewicht:"📈",Ziele:"⚙️"}[x])+'<br>'+x+'</button>').join("");let h="";if(page==="Heute"){let i=di(),t=[0,0,0,0];s.plan[i].forEach((id,j)=>{if(visible(i,j)&&s.done[i+"-"+j])for(let n=0;n<4;n++)t[n]+=R[id][n+2]});h='<h2>Heute · '+date(i)+'</h2><div class="grid">'+["Kalorien","Protein","Kohlenhydrate","Fett"].map((x,n)=>'<div class="stat"><small>'+x+'</small><strong>'+t[n]+' '+(n?"g":"kcal")+'</strong>'+(n<2?'<small>Ziel: '+(n?s.protein:s.kcal)+'</small>':"")+'</div>').join("")+'</div><div class="card"><button class="primary wide" id="onlyDinner">🌙 Heute nur Abendessen</button><p><small>Entfernt für heute Frühstück, Mittagessen und Snack aus deinem Plan und aus der Einkaufsliste. Nichts wird als gegessen gezählt.</small></p></div><div class="card"><h3>Deine Mahlzeiten</h3>'+s.plan[i].map((id,j)=>!visible(i,j)?"":'<details class="item"><summary>'+R[id][1]+': '+R[id][0]+(s.done[i+"-"+j]?" ✓":"")+'<small>'+R[id][2]+' kcal · '+R[id][3]+' g Protein</small></summary><p><b>Zutaten für 1 Portion</b></p><ul>'+R[id][6].map(z=>'<li>'+z[0]+': '+z[1]+' '+z[2]+'</li>').join("")+'</ul><p><b>Zubereitung</b><br>'+R[id][7]+'</p><p><label>Preis pro Portion (€) <input type="number" min="0" step="0.01" inputmode="decimal" data-cost="'+i+"-"+j+'" value="'+(s.costs[i+"-"+j]||"")+'" placeholder="z. B. 3.50"></label></p><div class="row"><button class="primary" data-togglemeal="'+i+"-"+j+'">'+(s.done[i+"-"+j]?"✓ Als nicht gegessen markieren":"✓ Mahlzeit abhaken")+'</button><button data-hide="'+i+"-"+j+'">Entfernen</button></div></details>').join("")+'<p><small>Tippe auf eine Mahlzeit, um das Rezept zu sehen.</small></p></div><details class="card"><summary>Entfernte Mahlzeiten wiederherstellen</summary>'+s.plan[i].map((id,j)=>visible(i,j)?"":'<div class="row item"><span>'+R[id][0]+'</span><button data-restore="'+i+"-"+j+'">Hinzufügen</button></div>').join("")+'</details><p><small>Nährwerte sind Schätzwerte und können je nach Produkt abweichen.</small></p>'}
if(page==="Woche")h='<h2>Wochenplan</h2><button class="primary wide" id="regen">↻ Neuen Plan erstellen</button><p><small>Die Einkaufsliste passt sich an entfernte Mahlzeiten an.</small></p>'+s.plan.map((a,i)=>'<div class="card"><h3>'+date(i)+'</h3>'+a.map((id,j)=>!visible(i,j)?'<div class="row item"><small>Entfernt: '+R[id][0]+'</small><button data-restore="'+i+"-"+j+'">Hinzufügen</button></div>':'<details class="item"><summary>'+R[id][1]+': '+R[id][0]+'</summary><p><b>Zutaten:</b> '+R[id][6].map(z=>z[0]+" "+z[1]+" "+z[2]).join(", ")+'</p><p><b>Zubereitung:</b> '+R[id][7]+'</p><button data-hide="'+i+"-"+j+'">Aus Plan entfernen</button></details>').join("")+'</div>').join("");
if(page==="Einkauf"){let list={};s.plan.forEach((day,i)=>day.forEach((id,j)=>{if(visible(i,j))R[id][6].forEach(z=>{let k=z[0]+"|"+z[2];list[k]=(list[k]||0)+z[1]})}));h='<h2>Einkaufsliste</h2><p><small>Alle Zutaten für die aktuell ausgewählten Mahlzeiten dieser Woche. Entfernte Mahlzeiten werden nicht mitgezählt.</small></p><button id="reset">Häkchen zurücksetzen</button><div class="card">'+Object.entries(list).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,n])=>'<label class="row item"><span style="'+(s.shop[k]?"text-decoration:line-through;opacity:.6":"")+'">'+k.split("|")[0]+' · '+n+' '+k.split("|")[1]+'</span><input type="checkbox" data-shop="'+k+'" '+(s.shop[k]?"checked":"")+'></label>').join("")+'</div>'}
if(page==="Statistik"){let now=today(),cut=period==="all"?"0000-01-01":new Date(Date.now()-(Number(period)-1)*86400000).toLocaleDateString("sv-SE");let rows=s.history.filter(x=>x.date>=cut&&x.date<=now&&R[x.id]);let total=[0,0,0,0,0],counts={},byDay={};rows.forEach(x=>{let r=R[x.id];for(let n=0;n<4;n++)total[n]+=r[n+2];total[4]+=Number(x.cost||0);counts[x.id]=(counts[x.id]||0)+1;if(!byDay[x.date])byDay[x.date]=[0,0];byDay[x.date][0]+=r[2];byDay[x.date][1]+=r[3]});let days=Object.keys(byDay).sort(),top=Object.entries(counts).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...days.map(d=>byDay[d][0]));h='<h2>📊 Deine Statistik</h2><div class="row"><button data-period="7" class="'+(period==="7"?"primary":"")+'">7 Tage</button><button data-period="30" class="'+(period==="30"?"primary":"")+'">30 Tage</button><button data-period="all" class="'+(period==="all"?"primary":"")+'">Gesamt</button></div><p><small>Nur abgehakte Mahlzeiten. Historische Daten werden ab diesem Update gesammelt.</small></p><div class="grid">'+[["Mahlzeiten",rows.length,""],["Kalorien",total[0],"kcal"],["Protein",total[1],"g"],["Kohlenhydrate",total[2],"g"],["Fett",total[3],"g"],["Essenskosten",money(total[4]),""]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join("")+'</div><div class="card"><h3>Ø pro Tag mit Einträgen</h3><div class="grid"><div><small>Kalorien</small><h2>'+Math.round(total[0]/(days.length||1))+' kcal</h2></div><div><small>Protein</small><h2>'+Math.round(total[1]/(days.length||1))+' g</h2></div></div></div><div class="card"><h3>Kalorienverlauf</h3>'+(days.length?days.slice(-14).map(d=>'<div class="row item"><small style="width:55px">'+d.slice(5)+'</small><div style="flex:1;background:#101827;border-radius:6px;overflow:hidden"><div style="background:#4ade80;height:16px;width:'+Math.max(2,Math.round(byDay[d][0]/max*100))+'%"></div></div><small>'+byDay[d][0]+'</small></div>').join(""):'<p>Noch keine Mahlzeiten in diesem Zeitraum abgehakt.</p>')+'</div><div class="card"><h3>Am häufigsten gegessen</h3>'+(top.length?top.slice(0,8).map(([id,n],i)=>'<div class="row item"><span>'+(i+1)+'. '+R[Number(id)][0]+'</span><b>'+n+'×</b></div>').join(""):'<p>Deine Lieblingsgerichte erscheinen hier, sobald du Mahlzeiten abhakst.</p>')+'</div><div class="card"><h3>Essenskosten</h3><p>Erfasste Ausgaben: <b>'+money(total[4])+'</b></p><p>Ø pro Mahlzeit: <b>'+money(total[4]/(rows.length||1))+'</b></p><p><small>Nur selbst eingetragene Portionspreise. 0 € kann auch heißen, dass kein Preis hinterlegt wurde. Das ist keine Einkaufsabrechnung.</small></p></div>'}
if(page==="Gewicht")h='<h2>Gewichtstracker</h2><div class="card"><h1>'+Number(s.weight).toFixed(1)+' kg</h1><div class="row"><input type="number" id="weight" min="20" max="350" step=".1" value="'+s.weight+'"><button class="primary" id="add">Eintragen</button></div></div><div class="card"><h3>Verlauf</h3>'+(s.weights.length?s.weights.slice().reverse().map(w=>'<div class="row item"><span>'+w.date+'</span><b>'+w.value+' kg</b></div>').join(""):'<p>Noch keine Einträge.</p>')+'</div>';
if(page==="Ziele")h='<h2>Ziele & Sicherung</h2><div class="card"><label>Kalorienziel<br><input type="number" id="kcal" value="'+s.kcal+'"></label><p></p><label>Proteinziel (g)<br><input type="number" id="protein" value="'+s.protein+'"></label><p></p><button class="primary" id="goals">Speichern</button></div><div class="card"><h3>Datensicherung</h3><p>Deine Daten liegen nur auf deinem Gerät. Beim Löschen von Safari-Daten können sie verloren gehen.</p><button id="export">Backup exportieren</button><p><label>Backup importieren <input type="file" id="import" accept=".json"></label></p></div><p><small>Die voreingestellten Ziele sind nur Startwerte, keine individuelle medizinische Empfehlung.</small></p>';document.getElementById("view").innerHTML=h}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}else if(b.dataset.period){period=b.dataset.period;render()}else if(b.id==="onlyDinner"){let i=di();s.plan[i].forEach((id,j)=>{if(R[id][1]!=="Abend"){s.hidden[i+"-"+j]=true;if(s.done[i+"-"+j])logMeal(i+"-"+j,false);delete s.done[i+"-"+j]}});save();render()}else if(b.dataset.togglemeal){let k=b.dataset.togglemeal;s.done[k]=!s.done[k];logMeal(k,s.done[k]);save();render()}else if(b.dataset.hide){s.hidden[b.dataset.hide]=true;if(s.done[b.dataset.hide])logMeal(b.dataset.hide,false);delete s.done[b.dataset.hide];save();render()}else if(b.dataset.restore){delete s.hidden[b.dataset.restore];save();render()}else if(b.id==="regen"){generate(Math.floor(Math.random()*50)+1);render()}else if(b.id==="reset"){s.shop={};save();render()}else if(b.id==="add"){let v=+document.getElementById("weight").value;if(v>=20&&v<=350){s.weight=v;s.weights.push({date:today(),value:v});save();render()}}else if(b.id==="goals"){let k=+document.getElementById("kcal").value,p=+document.getElementById("protein").value;if(k>=1000&&k<=6000&&p>=30&&p<=350){s.kcal=k;s.protein=p;save();render()}}else if(b.id==="export"){let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="musclefuel-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});
document.addEventListener("change",async e=>{let x=e.target;if(x.dataset.cost){let n=Number(x.value);if(Number.isFinite(n)&&n>=0){s.costs[x.dataset.cost]=n;let [i,j]=x.dataset.cost.split("-").map(Number),key=mealDate(i)+"-"+j;let record=s.history.find(z=>z.key===key);if(record)record.cost=n;save()}}if(x.dataset.done){s.done[x.dataset.done]=x.checked;save();render()}if(x.dataset.shop){s.shop[x.dataset.shop]=x.checked;save();render()}if(x.id==="import"){try{let d=JSON.parse(await x.files[0].text());if(!Array.isArray(d.plan)||d.plan.length!==7)throw Error();s=d;if(!s.hidden)s.hidden={};if(!Array.isArray(s.history))s.history=[];if(!s.costs)s.costs={};save();render()}catch(err){alert("Ungültige Sicherung")}}});render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
